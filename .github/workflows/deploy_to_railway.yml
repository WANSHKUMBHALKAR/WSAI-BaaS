name: Deploy to Railway (config-only)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Railway
        # This action requires the following repository secrets to be set:
        # - RAILWAY_API_KEY
        # - RAILWAY_PROJECT_ID
        # Optionally set secrets.RUN_MIGRATIONS=true and POSTGRES_* to run migrations after deploy.
        uses: railwayapp/railway-deploy@v1
        with:
          railwayToken: ${{ secrets.RAILWAY_API_KEY }}
          projectId: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment: production
          path: backend

      - name: Optional: run migrations (alembic)
        if: ${{ secrets.RUN_MIGRATIONS == 'true' }}
        env:
          POSTGRES_SERVER: ${{ secrets.POSTGRES_SERVER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend
          alembic upgrade head
